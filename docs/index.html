<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1630">
<title>Alvik Remote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alvik">
<script type="importmap">{ "imports": { "three": "./vendor/three/three.module.min.js" } }</script>
<style>
  :root {
    --bg: #1b1630; --panel: #2a2347; --text: #fff; --muted: #b8b0d8;
    --up: #3fa9f5; --lights: #ffd23f; --turbo: #ff6b35; --disco: #c86bfa; --bumper: #3ddc84;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; gap: 16px;
    user-select: none; -webkit-user-select: none; touch-action: none;
    overflow: hidden;
  }
  header { width: 100%; max-width: 1000px; display: flex; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 28px; flex: 1; white-space: nowrap; }
  #status { font-size: 16px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  @media (max-width: 560px) { #statusText, #toolsText, #layout span, #title { display: none; } #layout button { font-size: 18px; padding: 5px 8px; } h1 { font-size: 24px; white-space: nowrap; } #tools { font-size: 18px; padding: 8px 10px; } #connect { font-size: 18px; padding: 11px 14px; } }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: #777; }
  #dot.on { background: var(--bumper); box-shadow: 0 0 10px var(--bumper); }
  #connect {
    font: inherit; font-size: 20px; font-weight: 700; border: 0; border-radius: 14px;
    padding: 12px 20px; background: var(--up); color: #fff; cursor: pointer;
  }
  #connect.connected { background: var(--panel); color: var(--muted); }
  #msg { max-width: 600px; text-align: center; color: var(--muted); font-size: 18px; line-height: 1.4; }
  #msg:empty { display: none; }
  main {
    flex: 1; width: 100%; max-width: 1000px;
  }
  .stick {
    --size: min(80vw, 42vh, 340px);
    width: var(--size); height: var(--size); border-radius: 50%; position: relative;
    background: radial-gradient(circle, #3a3163 0%, var(--panel) 70%);
    box-shadow: inset 0 0 0 6px rgba(255,255,255,.08), 0 6px 0 rgba(0,0,0,.35);
    touch-action: none; cursor: grab; transition: opacity .2s;
  }
  .stick.disabled { opacity: .35; cursor: default; }
  .stick .mark { position: absolute; font-size: calc(var(--size) * .09); color: var(--muted); opacity: .6; pointer-events: none; }
  .mark.n { top: 4%; left: 50%; transform: translateX(-50%); }
  .mark.s { bottom: 4%; left: 50%; transform: translateX(-50%); }
  .mark.w { left: 5%; top: 50%; transform: translateY(-50%); }
  .mark.e { right: 5%; top: 50%; transform: translateY(-50%); }
  #knob {
    position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8fd0ff, var(--up) 60%);
    box-shadow: 0 8px 0 rgba(0,0,0,.35); pointer-events: none;
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--size) * .16);
    transition: transform .12s ease-out;
  }
  .stick.active #knob { transition: none; filter: brightness(1.15); }
  .actions { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 520px; }
  button.big {
    font: inherit; color: #1b1630; border: 0; border-radius: 22px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .05s, box-shadow .05s, opacity .2s;
  }
  button.big:disabled { opacity: .35; }
  button.big.down { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.35); filter: brightness(1.15); }
  button.big.action { height: clamp(58px, 11vh, 86px); font-size: 14px; font-weight: 800; gap: 1px; border-radius: 18px; padding: 0; }
  .action .emoji { font-size: clamp(24px, 4.4vh, 32px); line-height: 1.1; }
  .action .state { font-size: 11px; font-weight: 700; opacity: .75; line-height: 1; }
  .action .state:empty { display: none; }
  .action[data-b="1"] { background: var(--lights); }
  .action[data-b="2"] { background: var(--turbo); }
  .action[data-b="3"] { background: var(--disco); }
  .action[data-b="4"] { background: var(--bumper); }
  .action.off { filter: saturate(.25) brightness(.8); }
  @keyframes disco {
    0% { background: #ff3b3b } 20% { background: #ffd23f } 40% { background: #3ddc84 }
    60% { background: #3fa9f5 } 80% { background: #c86bfa } 100% { background: #ff3b3b }
  }
  .action.dancing { animation: disco .6s linear infinite; }
  /* two-hand layout: left thumb = speed, right thumb = steering */
  .slider {
    display: none; position: relative; border-radius: 999px; touch-action: none; cursor: grab;
    background: var(--panel); box-shadow: inset 0 0 0 6px rgba(255,255,255,.08), 0 6px 0 rgba(0,0,0,.35);
    align-items: center; justify-content: center; transition: opacity .2s;
  }
  .slider.disabled { opacity: .35; cursor: default; }
  .slider .knob {
    border-radius: 50%; pointer-events: none; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 35% 30%, #8fd0ff, var(--up) 60%);
    box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .12s ease-out;
  }
  .slider.active .knob { transition: none; filter: brightness(1.15); }
  .slider .mark { position: absolute; color: var(--muted); opacity: .6; pointer-events: none; font-size: 22px; }
  #throttle { --w: min(26vw, 130px); width: var(--w); height: min(38vh, 320px); }
  #steer { --w: min(26vw, 130px); height: var(--w); width: min(52vw, 320px); }
  .slider .knob { width: calc(var(--w) - 16px); height: calc(var(--w) - 16px); font-size: calc(var(--w) * .4); }
  #throttle .mark.n { top: 8px; } #throttle .mark.s { bottom: 8px; }
  #steer .mark.w { left: 12px; } #steer .mark.e { right: 12px; }
  body[data-layout="two"] #stick { display: none; }
  body[data-layout="two"] .slider { display: flex; }
  /* Where things go. The 3D robot gets whatever room is left; the four buttons are a slim dock.
       one hand, tall:  robot / joystick / dock          one hand, wide:  joystick | robot over dock
       two hands, tall: dock / speed | robot over steer  two hands, wide: speed | robot over dock | steer */
  main {
    display: grid; gap: 14px; min-height: 0; justify-items: center; align-items: center;
    grid-template-areas: "w" "k" "a"; grid-template-rows: minmax(0, 1fr) auto auto; grid-template-columns: minmax(0, 1fr);
  }
  #stick { grid-area: k; } .actions { grid-area: a; } #throttle { grid-area: t; } #steer { grid-area: s; }
  body[data-layout="two"] main {
    grid-template-areas: "a a" "t w" "t s"; grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-columns: auto minmax(0, 1fr);
  }
  @media (min-aspect-ratio: 1/1) {
    .stick { --size: min(40vw, 62vh, 340px); }
    main { grid-template-areas: "k w" "k a"; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: auto minmax(0, 1fr); column-gap: 24px; }
    body[data-layout="two"] main { grid-template-areas: "t w s" "t a s"; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: auto minmax(0, 1fr) auto; }
    #throttle { --w: min(16vw, 130px); height: min(62vh, 340px); }
    #steer { --w: min(16vw, 130px); width: min(30vw, 340px); }
  }
  /* The 3D robot: a live copy of the real one (twin.js), with a few numbers over it. */
  #twin {
    grid-area: w; position: relative; width: 100%; align-self: stretch; min-height: 0;
    border-radius: 18px; overflow: hidden; background: var(--bg);
    box-shadow: 0 4px 0 rgba(0,0,0,.35);
  }
  #twin[hidden] { display: none; }
  #twin canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }   /* never sets the card's size */
  #twin::after {            /* the frame, drawn over the picture */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.1);
  }
  #twinCredit {             /* who made the model: the licence asks for it */
    position: absolute; left: 10px; top: 7px; font-size: 10px; color: var(--muted); opacity: .75; white-space: nowrap;
    max-width: calc(100% - 56px); overflow: hidden; text-overflow: ellipsis;
  }
  #twinCredit a { color: inherit; }
  #twinStats {
    position: absolute; left: 10px; right: 10px; bottom: 7px; display: flex; gap: 12px; pointer-events: none;
    font-size: 14px; font-weight: 700; color: var(--muted); text-shadow: 0 1px 2px #000; white-space: nowrap;
  }
  #twinInfo.slow { color: var(--lights); } #twinInfo.stop { color: #ff6b6b; }
  #twinBattery { margin-left: auto; } #twinBattery.low { color: #ff6b6b; }
  #twinNorth {
    position: absolute; right: 6px; top: 6px; font: inherit; font-size: 18px; line-height: 1; padding: 6px;
    border: 0; border-radius: 10px; background: rgba(42,35,71,.8); cursor: pointer;
  }
  @media (max-height: 480px) { .action .state { display: none; } #twinCredit { display: none; } }
  /* one hand / two hands switch: both shown, the one in use is lit */
  #layout { display: flex; background: var(--panel); border-radius: 12px; padding: 3px; gap: 2px; }
  #layout button {
    font: inherit; font-size: 15px; font-weight: 700; color: var(--muted); background: none;
    border: 0; border-radius: 9px; padding: 7px 10px; white-space: nowrap; cursor: pointer;
  }
  #layout button[aria-pressed="true"] { background: var(--up); color: #fff; }
  footer { color: var(--muted); font-size: 14px; text-align: center; }
  #tools {
    font-size: 15px; font-weight: 700; text-decoration: none; color: var(--muted);
    background: var(--panel); border-radius: 12px; padding: 10px 12px; white-space: nowrap;
  }
</style>
</head>
<body>
<header>
  <h1>🤖<span id="title"> Alvik</span></h1>
  <div id="status"><span id="dot"></span><span id="statusText">Not connected</span></div>
  <div id="layout" role="group" aria-label="How you drive">
    <button data-layout="stick" title="One joystick">🕹️<span> One hand</span></button>
    <button data-layout="two" title="Left thumb speed, right thumb steering">🙌<span> Two hands</span></button>
  </div>
  <a id="tools" href="flash.html" title="Grown-ups: put new code on the robot over USB">🔧<span id="toolsText"> Update robot</span></a>
  <button id="connect">Connect</button>
</header>

<div id="msg"></div>

<main>
  <div class="stick disabled" id="stick" role="application" aria-label="Drive: drag the ball. Push a little to go slow, a lot to go fast.">
    <span class="mark n">▲</span><span class="mark w">◀</span><span class="mark e">▶</span><span class="mark s">▼</span>
    <div id="knob">🤖</div>
  </div>
  <div class="slider disabled" id="throttle" role="application" aria-label="Speed: slide up to go forward, down to go back">
    <span class="mark n">▲</span><span class="mark s">▼</span><div class="knob">🚗</div>
  </div>
  <div class="slider disabled" id="steer" role="application" aria-label="Steering: slide left or right">
    <span class="mark w">◀</span><span class="mark e">▶</span><div class="knob">↔️</div>
  </div>

  <div id="twin" hidden title="This is your robot, live">
    <canvas aria-label="A 3D picture of the robot. It turns, drives and lights up like the real one."></canvas>
    <div id="twinStats"><span id="twinInfo"></span><span id="twinSpeed"></span><span id="twinBattery"></span></div>
    <span id="twinCredit">3D: <a href="https://docs.arduino.cc/hardware/alvik/" target="_blank" rel="noopener">Arduino</a> +
      <a href="https://makerworld.com/en/models/1298936" target="_blank" rel="noopener">GiulioT</a> · CC BY-NC-SA</span>
    <button id="twinNorth" title="Tap when the robot is pointing away from you">🧭</button>
  </div>

  <div class="actions">
    <button class="big action" data-b="1"><span class="emoji">💡</span>Lights<span class="state"></span></button>
    <button class="big action" data-b="2"><span class="emoji">🚀</span>Turbo<span class="state" id="turboState">off</span></button>
    <button class="big action" data-b="3"><span class="emoji">🪩</span>Disco!<span class="state"></span></button>
    <button class="big action" data-b="4"><span class="emoji">🛡️</span>Bumper<span class="state" id="bumperState">on</span></button>
  </div>
</main>

<footer>On the robot: tap ⬆ until the lights are <b>purple</b>, then tap ✓. Yellow = ready to connect.</footer>

<script type="module">
import { initPwa } from "./pwa.js";
import { NUS_TX, telemetryRequest, telemetryReader } from "./telemetry.js";   // packets: see there

// Talks to remote_control.py on the robot over the Nordic UART service.
// Buttons are the "Control Pad" packets the Bluefruit Connect app sends:
//   '!' 'B' <button '1'-'8'> <'1' down / '0' up> <checksum>     1 lights, 2 turbo, 3 disco, 4 bumper
// Driving is our own joystick packet (the robot also still takes Bluefruit's arrows, buttons 5-8):
//   '!' 'J' <x> <y> <checksum>     signed bytes -100..100, x right, y forward
// Checksum = ~(sum of the first 4 bytes) & 0xff. The robot stops if joystick packets stop coming
// for 0.6 s, so while the stick is held we repeat it.
// The robot talks back too (telemetry.js): heading, lights, speed, turbo and bumper, then what its
// sensors see in front and underneath, about eight times a second once we ask. That drives the
// 3D robot (twin.js) and the Turbo / Bumper labels.
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";   // robot listens here

const $ = (id) => document.getElementById(id);
const allButtons = [...document.querySelectorAll("button.big")];
let device = null, rx = null;
let queue = Promise.resolve();          // BLE writes must not overlap
let turbo = false, bumper = true;       // robot starts each session with turbo off, bumper on
const held = new Map();                 // pointerId / key -> button number
let pwa = null;                         // set up at the bottom
let twin = null;                        // the 3D robot, once it has loaded (the remote works without it)
let heard = false;                      // has this robot sent telemetry? (one with old code never does)
let toggledAt = 0;                      // when Turbo or Bumper was last pressed here

function packet(kind, a, b) {
  const bytes = [0x21, kind.charCodeAt(0), a & 0xff, b & 0xff];
  bytes.push(~bytes.reduce((x, y) => x + y, 0) & 0xff);
  return new Uint8Array(bytes);
}

function write(data) {
  queue = queue.then(() => {
    const ch = rx;
    if (!ch) return;
    return ch.writeValueWithoutResponse ? ch.writeValueWithoutResponse(data) : ch.writeValue(data);
  }).catch((e) => console.warn("write failed", e));
  return queue;
}

function send(button, pressed) {
  if (rx) write(packet("B", 48 + button, pressed ? 0x31 : 0x30));
}

// ---------- driving ----------
// Two layouts, picked with the switch in the header and remembered on this device:
//   stick = one joystick · two = left thumb speed + right thumb steering
// Arrow keys / WASD work in all of them.
const stickEl = $("stick"), knob = $("knob"), throttleEl = $("throttle"), steerEl = $("steer");
const controls = [stickEl, throttleEl, steerEl];
const DEAD = 0.18;                      // middle of the stick does nothing (per axis: easy to go straight)
const ARROWS = {
  ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
  KeyW: [0, 1], KeyS: [0, -1], KeyA: [-1, 0], KeyD: [1, 0],
};
const LAYOUTS = ["stick", "two"];
let layout = "stick";
const touch = { x: 0, y: 0 };           // what the on-screen controls say, each -1..1
const arrowsDown = new Set();
const dragResets = [];
let want = [0, 0], sent = [0, 0], sentAt = 0, stickBusy = false;

const shape = (v) => Math.abs(v) < DEAD ? 0 : Math.sign(v) * (Math.abs(v) - DEAD) / (1 - DEAD);
const clamp = (v) => Math.max(-1, Math.min(1, v));

function updateStick() {
  let x = touch.x, y = touch.y;
  for (const k of arrowsDown) { x += ARROWS[k][0]; y += ARROWS[k][1]; }
  x = clamp(x); y = clamp(y);
  const s = stickEl.getBoundingClientRect(), t = throttleEl.getBoundingClientRect(), h = steerEl.getBoundingClientRect();
  knob.style.transform = `translate(${x * s.width * 0.3}px, ${-y * s.width * 0.3}px)`;
  throttleEl.querySelector(".knob").style.transform = `translateY(${-y * (t.height - t.width) / 2}px)`;
  steerEl.querySelector(".knob").style.transform = `translateX(${x * (h.width - h.height) / 2}px)`;
  want = [Math.round(shape(x) * 100), Math.round(shape(y) * 100)];
  pumpStick();
}

function pumpStick() {
  if (!rx || stickBusy) return;
  const now = performance.now();
  const changed = want[0] !== sent[0] || want[1] !== sent[1];
  const moving = sent[0] || sent[1];
  if (!changed && !(moving && now - sentAt > 150)) return;       // nothing new, no repeat due
  if (changed && (want[0] || want[1]) && now - sentAt < 40) return;   // not too chatty (a stop goes at once)
  const v = [...want];
  stickBusy = true;
  write(packet("J", v[0], v[1])).then(() => { sent = v; sentAt = performance.now(); stickBusy = false; });
}
setInterval(pumpStick, 50);

function readStick(e) {
  const r = stickEl.getBoundingClientRect();
  const reach = r.width * 0.3;
  let x = (e.clientX - (r.left + r.width / 2)) / reach;
  let y = -(e.clientY - (r.top + r.height / 2)) / reach;
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  touch.x = x; touch.y = y;
}
function readThrottle(e) {
  const r = throttleEl.getBoundingClientRect();
  touch.y = clamp(-(e.clientY - (r.top + r.height / 2)) / ((r.height - r.width) / 2));
}
function readSteer(e) {
  const r = steerEl.getBoundingClientRect();
  touch.x = clamp((e.clientX - (r.left + r.width / 2)) / ((r.width - r.height) / 2));
}

// hold and drag; letting go springs back
function drag(el, read, clear) {
  let id = null;
  const end = (e) => {
    if (e.pointerId !== id) return;
    id = null; el.classList.remove("active"); clear(); updateStick();
  };
  el.addEventListener("pointerdown", (e) => {
    if (!rx || id !== null) return;
    e.preventDefault();
    el.setPointerCapture?.(e.pointerId);
    id = e.pointerId; el.classList.add("active"); read(e); updateStick();
  });
  el.addEventListener("pointermove", (e) => { if (e.pointerId === id) { read(e); updateStick(); } });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) => el.addEventListener(t, end));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
  dragResets.push(() => { id = null; el.classList.remove("active"); });
}
drag(stickEl, readStick, () => { touch.x = 0; touch.y = 0; });
drag(throttleEl, readThrottle, () => { touch.y = 0; });
drag(steerEl, readSteer, () => { touch.x = 0; });

function centreStick() {
  touch.x = 0; touch.y = 0;
  arrowsDown.clear();
  dragResets.forEach((f) => f());
  updateStick();
}

function setLayout(name) {
  if (!LAYOUTS.includes(name)) name = "stick";
  centreStick();
  layout = name;
  document.body.dataset.layout = name;
  document.querySelectorAll("#layout button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.layout === name)));
  try { localStorage.setItem("alvik-layout", name); } catch {}
  updateStick();
}
document.querySelectorAll("#layout button").forEach((b) =>
  b.addEventListener("click", () => setLayout(b.dataset.layout)));
addEventListener("resize", updateStick);

function setConnected(on) {
  if (!on) pwa?.idle();
  $("dot").classList.toggle("on", on);
  $("statusText").textContent = on ? "Connected" : "Not connected";
  $("connect").textContent = on ? "Disconnect" : "Connect";
  $("connect").classList.toggle("connected", on);
  allButtons.forEach((b) => (b.disabled = !on));
  controls.forEach((c) => c.classList.toggle("disabled", !on));
  sent = [0, 0]; stickBusy = false;      // a robot we just met is standing still
  heard = false;
  twin?.reset();
  showDistance(null);
  showBattery(null);
  if (on) {
    turbo = false; bumper = true; showToggles();
  } else {
    held.clear();
    allButtons.forEach((b) => b.classList.remove("down"));
    centreStick();
  }
}

function showToggles() {
  $("turboState").textContent = turbo ? "ON" : "off";
  $("bumperState").textContent = bumper ? "on" : "OFF";
  document.querySelector('[data-b="2"]').classList.toggle("off", !turbo);
  document.querySelector('[data-b="4"]').classList.toggle("off", !bumper);
}

// ---------- what the robot says back ----------
function showDistance(t) {
  const info = $("twinInfo"), cm = t?.distance ?? null;
  info.textContent = cm === null || cm > 99 ? "" : `🧱 ${cm} cm`;
  info.className = t?.blocked || (cm !== null && cm < 12) ? "stop" : cm !== null && cm < 30 ? "slow" : "";
  const speed = Math.round(Math.abs(t?.speed ?? 0));
  $("twinSpeed").textContent = speed ? `💨 ${speed} cm/s` : "";
}

// The second packet: all five distance zones, how the robot is tilted, and the battery.
function onSensors(s) {
  twin?.sensors(s);
  showBattery(s.battery);
}
// The third packet: what is under the robot (line sensors, the floor's colour, how far down the floor is).
function onUnder(u) {
  twin?.under(u);
}
function showBattery(pct) {
  const el = $("twinBattery");
  el.textContent = pct === null || pct === undefined ? "" : `${pct < 20 ? "🪫" : "🔋"} ${pct}%`;
  el.classList.toggle("low", pct !== null && pct < 20);
}

function onTelemetry(t) {
  if (!heard) $("msg").textContent = "";
  heard = true;
  // The robot knows best, so the labels can't drift. Just after a press we wait a moment: the
  // packet in the air may be from before the robot heard it.
  if ((t.turbo !== turbo || t.bumper !== bumper) && performance.now() - toggledAt > 500) {
    turbo = t.turbo; bumper = t.bumper; showToggles();
  }
  twin?.update(t);
  showDistance(t);
}

// Old robot code has the TX characteristic but never sends anything: then the 3D robot just stands still.
async function listen(service) {
  try {
    const tx = await service.getCharacteristic(NUS_TX);
    const feed = telemetryReader(onTelemetry, onSensors, onUnder);
    tx.addEventListener("characteristicvaluechanged", (e) => {
      const v = e.target.value;
      feed(new Uint8Array(v.buffer, v.byteOffset, v.byteLength));
    });
    await tx.startNotifications();
    await write(telemetryRequest(true));
    setTimeout(() => {
      if (rx && !heard) $("msg").textContent = "The 3D robot needs new robot code. Tap 🔧 to update the robot.";
    }, 3000);
  } catch (e) {
    console.warn("no telemetry", e);
  }
}

async function connect() {
  if (device?.gatt?.connected) { device.gatt.disconnect(); return; }
  try {
    $("msg").textContent = "";
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [NUS] }, { namePrefix: "Alvik" }],
      optionalServices: [NUS],
    });
    device.addEventListener("gattserverdisconnected", () => { rx = null; setConnected(false); });
    $("statusText").textContent = "Connecting…";
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(NUS);
    rx = await service.getCharacteristic(RX);
    setConnected(true);
    listen(service);
  } catch (e) {
    if (e.name !== "NotFoundError") {   // NotFoundError = user closed the picker
      $("msg").textContent = "Couldn't connect: " + e.message +
        ". Is the robot on purple mode with yellow lights?";
    }
    setConnected(false);
  }
}

function press(id, el) {
  const b = Number(el.dataset.b);
  held.set(id, b);
  el.classList.add("down");
  send(b, true);
  if (b === 2) { turbo = !turbo; showToggles(); toggledAt = performance.now(); }
  if (b === 4) { bumper = !bumper; showToggles(); toggledAt = performance.now(); }
  if (b === 3) { el.classList.add("dancing"); setTimeout(() => el.classList.remove("dancing"), 4000); }
}

function release(id) {
  const b = held.get(id);
  if (b === undefined) return;
  held.delete(id);
  // only lift the button if no other finger/key is still holding it
  if (![...held.values()].includes(b)) {
    document.querySelector(`[data-b="${b}"]`).classList.remove("down");
    send(b, false);
  }
}

function releaseAll() { [...held.keys()].forEach(release); centreStick(); }

// touch / mouse on the action buttons
allButtons.forEach((el) => {
  el.addEventListener("pointerdown", (e) => {
    if (el.disabled) return;
    e.preventDefault();
    el.setPointerCapture?.(e.pointerId);
    press("p" + e.pointerId, el);
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) =>
    el.addEventListener(t, (e) => release("p" + e.pointerId)));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
});

// keyboard on a laptop: arrows push the joystick all the way, 1-4 for the action buttons
const KEYS = { Digit1: 1, Digit2: 2, Digit3: 3, Digit4: 4 };
addEventListener("keydown", (e) => {
  if (e.code === "Escape") { centreStick(); return; }
  if (ARROWS[e.code] && rx) {
    e.preventDefault();
    if (!e.repeat) { arrowsDown.add(e.code); updateStick(); }
    return;
  }
  const b = KEYS[e.code];
  if (!b || e.repeat || !rx) return;
  e.preventDefault();
  press("k" + e.code, document.querySelector(`[data-b="${b}"]`));
});
addEventListener("keyup", (e) => {
  if (arrowsDown.delete(e.code)) updateStick();
  release("k" + e.code);
});

// safety: stop driving if the page is hidden or loses focus
addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => document.hidden && releaseAll());

$("connect").addEventListener("click", connect);
setConnected(false);
let savedLayout = "stick";
try { savedLayout = localStorage.getItem("alvik-layout") || "stick"; } catch {}
setLayout(savedLayout);

if (!navigator.bluetooth) {
  $("connect").disabled = true;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  $("msg").innerHTML = ios
    ? "This browser can't talk to Bluetooth robots. On iPad, open this page in the free <b>Bluefy</b> app instead."
    : "This browser can't talk to Bluetooth robots. Try <b>Chrome</b> or <b>Edge</b>.";
}

// The 3D robot loads after everything else, and the remote is fine without it (old phone, no WebGL).
const twinEl = $("twin");
import("./twin.js")
  .then(({ createTwin }) => { twinEl.hidden = false; return createTwin(twinEl.querySelector("canvas")); })
  .then((t) => { twin = t; })
  .catch((e) => { twinEl.hidden = true; console.warn("no 3D robot", e); });
twinEl.addEventListener("click", (e) => {
  if (e.target.id === "twinNorth") twin?.recentre();
});

// Installable app + self-updating (pwa.js). Never reload while connected: that drops Bluetooth
// and the robot brakes, so the reload waits until it disconnects.
pwa = initPwa({ isBusy: () => !!device?.gatt?.connected, whenBusy: "It will reload after you disconnect." });
</script>
</body>
</html>
