<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1b1630">
<title>Alvik Remote</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Alvik">
<style>
  :root {
    --bg: #1b1630; --panel: #2a2347; --text: #fff; --muted: #b8b0d8;
    --up: #3fa9f5; --lights: #ffd23f; --turbo: #ff6b35; --disco: #c86bfa; --bumper: #3ddc84;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px; gap: 16px;
    user-select: none; -webkit-user-select: none; touch-action: none;
    overflow: hidden;
  }
  header { width: 100%; max-width: 900px; display: flex; align-items: center; gap: 12px; }
  h1 { margin: 0; font-size: 28px; flex: 1; }
  #status { font-size: 16px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: #777; }
  #dot.on { background: var(--bumper); box-shadow: 0 0 10px var(--bumper); }
  #connect {
    font: inherit; font-size: 20px; font-weight: 700; border: 0; border-radius: 14px;
    padding: 12px 20px; background: var(--up); color: #fff; cursor: pointer;
  }
  #connect.connected { background: var(--panel); color: var(--muted); }
  #msg { max-width: 600px; text-align: center; color: var(--muted); font-size: 18px; line-height: 1.4; }
  #msg:empty { display: none; }
  main {
    flex: 1; width: 100%; max-width: 900px;
    display: flex; align-items: center; justify-content: space-around; gap: 24px; flex-wrap: wrap;
  }
  .stick {
    --size: min(80vw, 56vh, 340px);
    width: var(--size); height: var(--size); border-radius: 50%; position: relative;
    background: radial-gradient(circle, #3a3163 0%, var(--panel) 70%);
    box-shadow: inset 0 0 0 6px rgba(255,255,255,.08), 0 6px 0 rgba(0,0,0,.35);
    touch-action: none; cursor: grab; transition: opacity .2s;
  }
  .stick.disabled { opacity: .35; cursor: default; }
  .stick .mark { position: absolute; font-size: calc(var(--size) * .09); color: var(--muted); opacity: .6; pointer-events: none; }
  .mark.n { top: 4%; left: 50%; transform: translateX(-50%); }
  .mark.s { bottom: 4%; left: 50%; transform: translateX(-50%); }
  .mark.w { left: 5%; top: 50%; transform: translateY(-50%); }
  .mark.e { right: 5%; top: 50%; transform: translateY(-50%); }
  #knob {
    position: absolute; left: 30%; top: 30%; width: 40%; height: 40%; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8fd0ff, var(--up) 60%);
    box-shadow: 0 8px 0 rgba(0,0,0,.35); pointer-events: none;
    display: flex; align-items: center; justify-content: center; font-size: calc(var(--size) * .16);
    transition: transform .12s ease-out;
  }
  .stick.active #knob { transition: none; filter: brightness(1.15); }
  .actions { display: grid; grid-template-columns: repeat(2, min(40vw, 170px)); gap: 14px; }
  button.big {
    font: inherit; color: #1b1630; border: 0; border-radius: 22px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 0 6px 0 rgba(0,0,0,.35); transition: transform .05s, box-shadow .05s, opacity .2s;
  }
  button.big:disabled { opacity: .35; }
  button.big.down { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.35); filter: brightness(1.15); }
  button.big.action { height: min(40vw, 32vh, 150px); font-size: 22px; font-weight: 800; gap: 4px; }
  .action .emoji { font-size: min(13vw, 56px); line-height: 1; }
  .action .state { font-size: 15px; font-weight: 700; opacity: .75; min-height: 1em; }
  .action[data-b="1"] { background: var(--lights); }
  .action[data-b="2"] { background: var(--turbo); }
  .action[data-b="3"] { background: var(--disco); }
  .action[data-b="4"] { background: var(--bumper); }
  .action.off { filter: saturate(.25) brightness(.8); }
  @keyframes disco {
    0% { background: #ff3b3b } 20% { background: #ffd23f } 40% { background: #3ddc84 }
    60% { background: #3fa9f5 } 80% { background: #c86bfa } 100% { background: #ff3b3b }
  }
  .action.dancing { animation: disco .6s linear infinite; }
  footer { color: var(--muted); font-size: 14px; text-align: center; }
  #tools {
    position: fixed; right: 10px; bottom: 8px; font-size: 18px; text-decoration: none;
    opacity: .35; padding: 6px;
  }
</style>
</head>
<body>
<header>
  <h1>🤖 Alvik</h1>
  <div id="status"><span id="dot"></span><span id="statusText">Not connected</span></div>
  <button id="connect">Connect</button>
</header>

<div id="msg"></div>

<main>
  <div class="stick disabled" id="stick" role="application" aria-label="Drive: drag the ball. Push a little to go slow, a lot to go fast.">
    <span class="mark n">▲</span><span class="mark w">◀</span><span class="mark e">▶</span><span class="mark s">▼</span>
    <div id="knob">🤖</div>
  </div>

  <div class="actions">
    <button class="big action" data-b="1"><span class="emoji">💡</span>Lights<span class="state"></span></button>
    <button class="big action" data-b="2"><span class="emoji">🚀</span>Turbo<span class="state" id="turboState">off</span></button>
    <button class="big action" data-b="3"><span class="emoji">🪩</span>Disco!<span class="state"></span></button>
    <button class="big action" data-b="4"><span class="emoji">🛡️</span>Bumper<span class="state" id="bumperState">on</span></button>
  </div>
</main>

<footer>On the robot: tap ⬆ until the lights are <b>purple</b>, then tap ✓. Yellow = ready to connect.</footer>

<a id="tools" href="flash.html" title="Grown-ups: put new code on the robot over USB" aria-label="Flash robot code">🔧</a>

<script type="module">
import { initPwa } from "./pwa.js";

// Talks to remote_control.py on the robot over the Nordic UART service.
// Buttons are the "Control Pad" packets the Bluefruit Connect app sends:
//   '!' 'B' <button '1'-'8'> <'1' down / '0' up> <checksum>     1 lights, 2 turbo, 3 disco, 4 bumper
// Driving is our own joystick packet (the robot also still takes Bluefruit's arrows, buttons 5-8):
//   '!' 'J' <x> <y> <checksum>     signed bytes -100..100, x right, y forward
// Checksum = ~(sum of the first 4 bytes) & 0xff. The robot stops if joystick packets stop coming
// for 0.6 s, so while the stick is held we repeat it.
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const RX  = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";   // robot listens here

const $ = (id) => document.getElementById(id);
const allButtons = [...document.querySelectorAll("button.big")];
let device = null, rx = null;
let queue = Promise.resolve();          // BLE writes must not overlap
let turbo = false, bumper = true;       // robot starts each session with turbo off, bumper on
const held = new Map();                 // pointerId / key -> button number
let pwa = null;                         // set up at the bottom

function packet(kind, a, b) {
  const bytes = [0x21, kind.charCodeAt(0), a & 0xff, b & 0xff];
  bytes.push(~bytes.reduce((x, y) => x + y, 0) & 0xff);
  return new Uint8Array(bytes);
}

function write(data) {
  queue = queue.then(() => {
    const ch = rx;
    if (!ch) return;
    return ch.writeValueWithoutResponse ? ch.writeValueWithoutResponse(data) : ch.writeValue(data);
  }).catch((e) => console.warn("write failed", e));
  return queue;
}

function send(button, pressed) {
  if (rx) write(packet("B", 48 + button, pressed ? 0x31 : 0x30));
}

// ---------- joystick ----------
const stickEl = $("stick"), knob = $("knob");
const DEAD = 0.18;                      // middle of the stick does nothing (per axis: easy to go straight)
const ARROWS = { ArrowUp: [0, 1], ArrowDown: [0, -1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
let stickPointer = null, pointerVec = [0, 0];
const arrowsDown = new Set();
let want = [0, 0], sent = [0, 0], sentAt = 0, stickBusy = false;

const shape = (v) => Math.abs(v) < DEAD ? 0 : Math.sign(v) * (Math.abs(v) - DEAD) / (1 - DEAD);

function updateStick() {
  let x = 0, y = 0;
  if (stickPointer !== null) [x, y] = pointerVec;
  else for (const k of arrowsDown) { x += ARROWS[k][0]; y += ARROWS[k][1]; }
  knob.style.transform = `translate(${x * 75}%, ${-y * 75}%)`;
  want = [Math.round(shape(x) * 100), Math.round(shape(y) * 100)];
  pumpStick();
}

function pumpStick() {
  if (!rx || stickBusy) return;
  const now = performance.now();
  const changed = want[0] !== sent[0] || want[1] !== sent[1];
  const moving = sent[0] || sent[1];
  if (!changed && !(moving && now - sentAt > 150)) return;       // nothing new, no repeat due
  if (changed && (want[0] || want[1]) && now - sentAt < 40) return;   // not too chatty (a stop goes at once)
  const v = [...want];
  stickBusy = true;
  write(packet("J", v[0], v[1])).then(() => { sent = v; sentAt = performance.now(); stickBusy = false; });
}
setInterval(pumpStick, 50);

function pointerToVec(e) {
  const r = stickEl.getBoundingClientRect();
  const reach = r.width * 0.3;
  let x = (e.clientX - (r.left + r.width / 2)) / reach;
  let y = -(e.clientY - (r.top + r.height / 2)) / reach;
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  return [x, y];
}

function centreStick() {
  stickPointer = null;
  pointerVec = [0, 0];
  arrowsDown.clear();
  stickEl.classList.remove("active");
  updateStick();
}

stickEl.addEventListener("pointerdown", (e) => {
  if (!rx || stickPointer !== null) return;
  e.preventDefault();
  stickEl.setPointerCapture?.(e.pointerId);
  stickPointer = e.pointerId;
  stickEl.classList.add("active");
  pointerVec = pointerToVec(e);
  updateStick();
});
stickEl.addEventListener("pointermove", (e) => {
  if (e.pointerId !== stickPointer) return;
  pointerVec = pointerToVec(e);
  updateStick();
});
["pointerup", "pointercancel", "lostpointercapture"].forEach((t) =>
  stickEl.addEventListener(t, (e) => {
    if (e.pointerId !== stickPointer) return;
    stickPointer = null;
    pointerVec = [0, 0];
    stickEl.classList.remove("active");
    updateStick();
  }));
stickEl.addEventListener("contextmenu", (e) => e.preventDefault());

function setConnected(on) {
  if (!on) pwa?.idle();
  $("dot").classList.toggle("on", on);
  $("statusText").textContent = on ? "Connected" : "Not connected";
  $("connect").textContent = on ? "Disconnect" : "Connect";
  $("connect").classList.toggle("connected", on);
  allButtons.forEach((b) => (b.disabled = !on));
  stickEl.classList.toggle("disabled", !on);
  sent = [0, 0]; stickBusy = false;      // a robot we just met is standing still
  if (on) {
    turbo = false; bumper = true; showToggles();
  } else {
    held.clear();
    allButtons.forEach((b) => b.classList.remove("down"));
    centreStick();
  }
}

function showToggles() {
  $("turboState").textContent = turbo ? "ON" : "off";
  $("bumperState").textContent = bumper ? "on" : "OFF";
  document.querySelector('[data-b="2"]').classList.toggle("off", !turbo);
  document.querySelector('[data-b="4"]').classList.toggle("off", !bumper);
}

async function connect() {
  if (device?.gatt?.connected) { device.gatt.disconnect(); return; }
  try {
    $("msg").textContent = "";
    device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [NUS] }, { namePrefix: "Alvik" }],
      optionalServices: [NUS],
    });
    device.addEventListener("gattserverdisconnected", () => { rx = null; setConnected(false); });
    $("statusText").textContent = "Connecting…";
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(NUS);
    rx = await service.getCharacteristic(RX);
    setConnected(true);
  } catch (e) {
    if (e.name !== "NotFoundError") {   // NotFoundError = user closed the picker
      $("msg").textContent = "Couldn't connect: " + e.message +
        ". Is the robot on purple mode with yellow lights?";
    }
    setConnected(false);
  }
}

function press(id, el) {
  const b = Number(el.dataset.b);
  held.set(id, b);
  el.classList.add("down");
  send(b, true);
  if (b === 2) { turbo = !turbo; showToggles(); }
  if (b === 4) { bumper = !bumper; showToggles(); }
  if (b === 3) { el.classList.add("dancing"); setTimeout(() => el.classList.remove("dancing"), 4000); }
}

function release(id) {
  const b = held.get(id);
  if (b === undefined) return;
  held.delete(id);
  // only lift the button if no other finger/key is still holding it
  if (![...held.values()].includes(b)) {
    document.querySelector(`[data-b="${b}"]`).classList.remove("down");
    send(b, false);
  }
}

function releaseAll() { [...held.keys()].forEach(release); centreStick(); }

// touch / mouse on the action buttons
allButtons.forEach((el) => {
  el.addEventListener("pointerdown", (e) => {
    if (el.disabled) return;
    e.preventDefault();
    el.setPointerCapture?.(e.pointerId);
    press("p" + e.pointerId, el);
  });
  ["pointerup", "pointercancel", "lostpointercapture"].forEach((t) =>
    el.addEventListener(t, (e) => release("p" + e.pointerId)));
  el.addEventListener("contextmenu", (e) => e.preventDefault());
});

// keyboard on a laptop: arrows push the joystick all the way, 1-4 for the action buttons
const KEYS = { Digit1: 1, Digit2: 2, Digit3: 3, Digit4: 4 };
addEventListener("keydown", (e) => {
  if (ARROWS[e.code] && rx) {
    e.preventDefault();
    if (!e.repeat) { arrowsDown.add(e.code); updateStick(); }
    return;
  }
  const b = KEYS[e.code];
  if (!b || e.repeat || !rx) return;
  e.preventDefault();
  press("k" + e.code, document.querySelector(`[data-b="${b}"]`));
});
addEventListener("keyup", (e) => {
  if (arrowsDown.delete(e.code)) updateStick();
  release("k" + e.code);
});

// safety: stop driving if the page is hidden or loses focus
addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", () => document.hidden && releaseAll());

$("connect").addEventListener("click", connect);
setConnected(false);

if (!navigator.bluetooth) {
  $("connect").disabled = true;
  const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  $("msg").innerHTML = ios
    ? "This browser can't talk to Bluetooth robots. On iPad, open this page in the free <b>Bluefy</b> app instead."
    : "This browser can't talk to Bluetooth robots. Try <b>Chrome</b> or <b>Edge</b>.";
}

// Installable app + self-updating (pwa.js). Never reload while connected: that drops Bluetooth
// and the robot brakes, so the reload waits until it disconnects.
pwa = initPwa({ isBusy: () => !!device?.gatt?.connected, whenBusy: "It will reload after you disconnect." });
</script>
</body>
</html>
